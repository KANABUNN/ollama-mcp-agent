[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-mcp-agent"
version = "0.1.0"
description = "A safety-focused local Ollama agent that uses a stdio MCP file server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Local project" }]
dependencies = [
  "jsonschema>=4.25,<5",
  "mcp>=1.30.0,<2",
  "ollama>=0.6.2,<0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
ollama-mcp-agent = "ollama_mcp_agent.agent:main"
ollama-pc-tools-server = "ollama_mcp_agent.pc_tools_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
